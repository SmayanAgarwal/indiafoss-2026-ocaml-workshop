<!doctype html>
<title>OCaml VM prototype (v86)</title>
<script src="v86/build/libv86.js"></script>
<style>
  body { font-family: monospace; background: #111; color: #ddd; }
  #screen_container { margin-top: 1em; }
  #stats { color: #8f8; white-space: pre; }
</style>
<div id="stats">loading ...</div>
<div id="screen_container">
  <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
  <canvas style="display: none"></canvas>
</div>
<script>
"use strict";
const t_page = performance.now();
performance.setResourceTimingBufferSize(50000);
const stats = document.getElementById("stats");
const params = new URLSearchParams(location.search);
const use_state = params.get("state") !== "0";
// ?base=images-cold serves the same data under fresh URLs, so the
// browser cache is cold: measures a first-time student's download.
const base = params.get("base") || "images";

function dl_bytes() {
    // transferSize only: browser-cache hits report 0 and must not
    // be counted (encodedBodySize would double-count repeats).
    let total = 0;
    for (const e of performance.getEntriesByType("resource")) {
        total += e.transferSize || 0;
    }
    return total;
}

window.onload = function () {
    const config = {
        wasm_path: "v86/build/v86.wasm",
        memory_size: 512 * 1024 * 1024,
        vga_memory_size: 8 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: { url: "v86/bios/seabios.bin" },
        vga_bios: { url: "v86/bios/vgabios.bin" },
        filesystem: {
            baseurl: base + "/ocaml-rootfs-flat/",
            basefs: base + "/ocaml-fs.json",
        },
        autostart: true,
        bzimage_initrd_from_filesystem: true,
        cmdline: "rw root=host9p rootfstype=9p rootflags=trans=virtio,cache=loose modules=virtio_pci tsc=reliable",
    };
    if (use_state) {
        config.initial_state = { url: base + "/ocaml-state.bin.zst" };
    }
    const emulator = new V86(config);
    window.emulator = emulator;

    // Time-to-interactive: ping the serial console and wait for the
    // shell prompt to come back.
    let serial = "";
    let interactive = false;
    emulator.add_listener("serial0-output-byte", function (byte) {
        serial += String.fromCharCode(byte);
        if (!interactive && serial.endsWith(":~# ")) {
            interactive = true;
            const tti = ((performance.now() - t_page) / 1000).toFixed(1);
            const mb = (dl_bytes() / 1024 / 1024).toFixed(1);
            stats.textContent =
                `interactive: ${tti}s after page load, ` +
                `downloaded so far: ${mb} MB (uncompressed transfer, ` +
                `no gzip on this server)`;
        }
    });
    emulator.add_listener("emulator-started", function () {
        setTimeout(() => emulator.serial0_send("\n"), 500);
    });

    // Live download counter until interactive.
    const iv = setInterval(function () {
        if (interactive) { clearInterval(iv); return; }
        const mb = (dl_bytes() / 1024 / 1024).toFixed(1);
        const t = ((performance.now() - t_page) / 1000).toFixed(0);
        stats.textContent = `waiting for prompt ... ${t}s, ${mb} MB downloaded`;
    }, 1000);
};
</script>
