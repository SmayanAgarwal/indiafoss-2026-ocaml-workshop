# Cloudflare Worker that records anonymous quiz responses for the
# NPTEL "Functional Programming with OCaml" course. Deployed by the
# .github/workflows/quiz-backend.yml workflow on push to main.
#
# The Worker exposes three routes (see src/index.js):
#   POST /quiz         insert a response
#   GET  /quiz/agg     aggregated per-quiz stats
#   POST /quiz/forget  DPDPA right-to-erasure: scrub by UUID

name = "nptel-quiz"
main = "src/index.js"
compatibility_date = "2024-09-23"

# D1 (managed SQLite) binding. The schema lives in migrations/.
# Apply migrations with:
#   npx wrangler d1 migrations apply nptel-quiz --remote
[[d1_databases]]
binding = "DB"
database_name = "nptel-quiz"
database_id = "1b7dfa1b-828f-4707-affd-3929f9c8bc4e"

# Light observability so we can spot 5xx and rate spikes from the
# Cloudflare dashboard without a separate logging stack.
[observability]
enabled = true
