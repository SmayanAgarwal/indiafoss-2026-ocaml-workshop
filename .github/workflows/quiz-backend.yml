# Deploys the Cloudflare Worker that records anonymous quiz
# responses for the NPTEL OCaml course. See tools/quiz-backend/
# for the Worker code, the D1 schema, and wrangler.toml.
#
# Secrets the workflow needs (configure in repo Settings → Secrets):
#   CLOUDFLARE_API_TOKEN   token with Workers + D1 edit permission
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID

name: Deploy quiz backend

on:
  push:
    branches: [main]
    paths:
      - 'tools/quiz-backend/**'
      - '.github/workflows/quiz-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/quiz-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nptel-quiz --remote

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/quiz-backend
          command: deploy

      - name: Smoke check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Probe the Worker via its workers.dev URL. The URL is
          # printed by wrangler deploy; we recover it from the
          # deployments API.
          set -e
          DEPLOY_URL=$(npx wrangler deployments list 2>&1 | grep -oE 'https://nptel-quiz\.[a-z0-9-]+\.workers\.dev' | head -1 || true)
          if [ -n "$DEPLOY_URL" ]; then
            echo "Probing $DEPLOY_URL/healthz"
            curl -sf "$DEPLOY_URL/healthz" && echo " OK"
          else
            echo "Worker URL not found in deployments list; skipping smoke check"
          fi
