# Deploys the Cloudflare Worker that records anonymous quiz
# responses for the NPTEL OCaml course. See tools/quiz-backend/
# for the Worker code, the D1 schema, and wrangler.toml.
#
# Secrets the workflow needs (configure in repo Settings → Secrets):
#   CLOUDFLARE_API_TOKEN   token with Workers + D1 edit permission
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID

name: Deploy quiz backend

on:
  push:
    branches: [main]
    paths:
      - 'tools/quiz-backend/**'
      - '.github/workflows/quiz-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/quiz-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nptel-quiz --remote

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/quiz-backend
          command: deploy

      - name: Smoke check
        run: |
          # Probe the Worker at its stable workers.dev URL (the same
          # one baked into every lecture page's quiz-api meta tag).
          # `wrangler deployments list` does not print workers.dev
          # URLs, so recovering it from there never worked; probe the
          # known URL and hard-fail rather than report green.
          set -e
          DEPLOY_URL="https://nptel-quiz.kc-7c7.workers.dev"
          echo "Probing $DEPLOY_URL/healthz and /quiz/agg"
          if ! curl -sf --max-time 30 --retry 3 --retry-delay 5 "$DEPLOY_URL/healthz"; then
            echo "::error::Smoke check failed: $DEPLOY_URL/healthz did not return 2xx"
            exit 1
          fi
          if ! curl -sf --max-time 30 --retry 3 --retry-delay 5 -o /dev/null "$DEPLOY_URL/quiz/agg"; then
            echo "::error::Smoke check failed: $DEPLOY_URL/quiz/agg did not return 2xx"
            exit 1
          fi
          echo " OK"
