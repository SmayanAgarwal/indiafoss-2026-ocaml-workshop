# Weekly off-Cloudflare backup of the nptel-quiz D1 database.
#
# D1 has point-in-time recovery on Cloudflare's side, but a plain SQL
# dump stored as a GitHub artifact gives us a copy that survives an
# account-level mishap and is trivially restorable with
#   npx wrangler d1 execute nptel-quiz --remote --file=backup.sql
#
# Uses the same secrets as quiz-backend.yml:
#   CLOUDFLARE_API_TOKEN   token with Workers + D1 edit permission
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID

name: D1 weekly backup

on:
  schedule:
    # Sundays 02:30 UTC; quiz traffic from India is at its lowest.
    - cron: '30 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/quiz-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install

      - name: Export database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx wrangler d1 export nptel-quiz --remote --output=backup.sql
          # An export that produced no file or an empty file is a
          # failure even if wrangler exited 0.
          test -s backup.sql
          echo "backup.sql: $(wc -l < backup.sql) lines, $(wc -c < backup.sql) bytes"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: nptel-quiz-d1-backup-${{ github.run_id }}
          path: tools/quiz-backend/backup.sql
          retention-days: 90
          if-no-files-found: error
