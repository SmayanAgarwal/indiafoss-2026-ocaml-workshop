<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360" role="img"
     aria-labelledby="val-expr-title val-expr-desc">
  <title id="val-expr-title">Values are a subset of expressions</title>
  <desc id="val-expr-desc">A large blue ellipse labelled "Expressions" contains a smaller purple ellipse labelled "Values" near the top.</desc>
  <defs>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="180" rx="120" ry="170" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#ds)"/>
  <ellipse cx="140" cy="110" rx="68" ry="78" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#ds)"/>
  <text x="140" y="118" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111">Values</text>
  <text x="140" y="300" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111">Expressions</text>
</svg>
